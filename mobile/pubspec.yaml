name: gesto_pago_mobile
description: App móvil de la Plataforma de Pagos de Servicios (Gesto Pago).
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/banners/
    # Fuentes empaquetadas (OFL): google_fonts las toma de aquí y no descarga nada de Google
    - assets/fonts/
