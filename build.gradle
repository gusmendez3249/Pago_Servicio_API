plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'org.springframework.boot' version '3.3.6'
    id 'org.sonarqube' version '4.0.0.2929'
    id 'org.owasp.dependencycheck' version '8.1.2'
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group = 'com.proyecto.servicio.empresa'
version = '1.0'

ext {
    set('springCloudVersion', '2023.0.5')
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

def lombokVersion = '1.18.30'
def mapstructVersion = '1.6.3'

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-config-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.oracle.database.jdbc:ojdbc8:23.2.0.0'
    implementation 'com.oracle.database.jdbc:ucp:23.2.0.0'
    implementation 'org.hibernate:hibernate-core:6.5.3.Final'
    implementation 'io.lettuce:lettuce-core:6.5.1.RELEASE'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'com.auth0:jwks-rsa:0.22.1'
    implementation 'com.auth0:java-jwt:4.4.0'

    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.json:json:20231013'

    implementation 'com.google.api-client:google-api-client:2.7.1'
    implementation 'com.google.api-client:google-api-client-jackson2:2.7.1'

    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.3'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'

    implementation 'org.apache.opennlp:opennlp-tools:2.2.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-inline:5.1.1'
    testImplementation 'com.h2database:h2:2.2.220'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'log4j', module: 'log4j'
}

test {
    useJUnitPlatform()
}

springBoot {
    buildInfo()
}

sonarqube {
    properties {
        property 'sonar.exclusions',
                '**/App.java,**/model/**,**/entity/**,**/enums/**,**/config/**,**/controller/**,**/service/configuracion/**'
    }
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

task dockerImage(type: Exec) {
    println 'CrearImagen'
    commandLine 'docker', 'build', '-t', 'proyecto-core:0.1', "$projectDir"
}

task dockerUp(type: Exec) {
    println 'Arranca imagen'
    commandLine 'docker-compose', '--compatibility', 'up'
}

dependencyCheck {
    formats = ['JSON', 'HTML']
}