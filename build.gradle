plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.5.16'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.owasp.dependencycheck' version '12.2.2'
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group = 'com.proyecto.servicio.empresa'
version = '1.0'

ext {
    set('springCloudVersion', '2025.0.3')
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

def lombokVersion = '1.18.42'
def mapstructVersion = '1.6.3'

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'


    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'log4j', module: 'log4j'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport  
}

springBoot {
    buildInfo()
}

sonar {
    properties {
        property 'sonar.projectKey', 'pago-servicio-api'
        property 'sonar.projectName', 'pago-servicio-api'
        property 'sonar.inclusions', '**/service/**,**/config/**'
    }
}

jacocoTestReport {
    dependsOn test  
    reports {
        xml.required = true
    }
}

task dockerImage(type: Exec) {
    println 'CrearImagen'
    commandLine 'docker', 'build', '-t', 'proyecto-core:0.1', "$projectDir"
}

task dockerUp(type: Exec) {
    println 'Arranca imagen'
    commandLine 'docker-compose', '--compatibility', 'up'
}

dependencyCheck {
    formats = ['JSON', 'HTML']
}