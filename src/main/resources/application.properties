server.port=8081

# Credenciales locales fuera del repositorio (archivo ignorado por git); opcional si se usan variables de entorno
spring.config.import=optional:file:./secretos.properties

# Base de datos
# Credenciales y secretos SOLO por variables de entorno (o gestor de secretos); nunca en el repositorio
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pago_servicios_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# ---------- Resistencia a carga (JMeter) ----------
# Pool de conexiones a PostgreSQL (leidos por ConfigDB)
app.datasource.max-pool-size=20
app.datasource.min-idle=5
app.datasource.connection-timeout-ms=3000

# Libera la conexion a BD al terminar el servicio y no al terminar la respuesta HTTP
spring.jpa.open-in-view=false

# Tomcat: hilos y cola de conexiones en espera ante picos de carga
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=500
server.tomcat.connection-timeout=10s
server.max-http-request-header-size=16KB

# Tamano maximo del cuerpo de la peticion (RequestSizeLimitFilter) -> 413
app.http.max-request-body-bytes=65536

# JSON estricto: rechaza "1" (String) o 1.5 (decimal) en campos Integer/Long en lugar de convertirlos
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# GestoPago
gestopago.base-url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_PASSWORD}
gestopago.auth.refresh-rate-ms=3600000

# Productos
gestopago.productos.endpoint=/sistema/service/getProductList.do
gestopago.productos.connect-timeout=5000
gestopago.productos.read-timeout=10000

# Pago de servicios (sendTx)
gestopago.sendtx.endpoint=/sistema/service/sendTx.do
gestopago.sendtx.unidad=${GESTOPAGO_UNIDAD:}
gestopago.sendtx.zone=America/Mexico_City
# X-API-Key opcional (vacío = no se envía)
gestopago.api-key=${GESTOPAGO_API_KEY:}
# AES-256-CBC: SECRET_KEY (32 bytes) e IV (16 bytes), ambos en Base64. Sin valor por defecto: sin ellos no se envía nada
gestopago.crypto.secret-key=${GESTOPAGO_SECRET_KEY:}
gestopago.crypto.iv=${GESTOPAGO_IV:}
# GestoPago espera hasta 62 s (CODIGO 82): la lectura de sendTx debe superarlo
gestopago.sendtx.connect-timeout=5000
gestopago.sendtx.read-timeout=65000
# Códigos de sendTx que NO son un rechazo definitivo (p. ej. 82 = el proveedor dejó de esperar al operador):
# la operación queda INDETERMINADA y se concilia en lugar de reintegrar el saldo
gestopago.sendtx.codigos-indeterminados=82
# Límites para productos de monto abierto (precio 0 en el catálogo); los de precio fijo exigen el precio exacto
gestopago.sendtx.monto-minimo=1.00
gestopago.sendtx.monto-maximo=10000.00

# Conciliación de pagos PENDIENTE/INDETERMINADA
gestopago.conciliacion.intervalo-ms=300000
gestopago.conciliacion.minutos-pendiente=5

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Config Server desactivado
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# Sincronización diaria de productos
#gestopago.productos.sync-cron=0 0 6 * * *
gestopago.productos.sync-cron=0 * * * * *
gestopago.productos.sync-zone=America/Mexico_City