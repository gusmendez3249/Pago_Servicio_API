server.port=${PORT:8081}

# Credenciales locales fuera del repositorio (archivo ignorado por git); opcional si se usan variables de entorno
spring.config.import=optional:file:./secretos.properties

# Base de datos
# Credenciales y secretos SOLO por variables de entorno (o gestor de secretos); nunca en el repositorio
# DB_URL completa, o por partes (DB_HOST, DB_PORT, DB_NAME) como las entrega Render en render.yaml
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pago_servicios_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo administra solo Flyway (db/migration); Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# ---------- Resistencia a carga (JMeter) ----------
# Pool de conexiones a PostgreSQL (leidos por ConfigDB)
app.datasource.max-pool-size=20
app.datasource.min-idle=5
app.datasource.connection-timeout-ms=3000

# Libera la conexion a BD al terminar el servicio y no al terminar la respuesta HTTP
spring.jpa.open-in-view=false

# Tomcat: hilos y cola de conexiones en espera ante picos de carga
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=500
server.tomcat.connection-timeout=10s
server.max-http-request-header-size=16KB

# Tamano maximo del cuerpo de la peticion (RequestSizeLimitFilter) -> 413
app.http.max-request-body-bytes=65536

# JSON estricto: rechaza "1" (String) o 1.5 (decimal) en campos Integer/Long en lugar de convertirlos
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# GestoPago
gestopago.base-url=https://gestopago.portalventas.net
# SSL/TLS hacia GestoPago: truststore propio con el certificado de gestopago.portalventas.net (*.portalventas.net)
# y su cadena (RapidSSL TLS RSA CA G1 -> DigiCert Global Root G2). false = usar el cacerts de la JVM
gestopago.ssl.enabled=true
gestopago.ssl.bundle=gestopago
# Versiones de TLS del cliente (solo se admiten TLSv1.3 y TLSv1.2; GestoPago rechaza 1.0/1.1)
gestopago.ssl.protocolos=TLSv1.3,TLSv1.2
spring.ssl.bundle.jks.gestopago.truststore.location=classpath:certs/gestopago-truststore.p12
spring.ssl.bundle.jks.gestopago.truststore.type=PKCS12
spring.ssl.bundle.jks.gestopago.truststore.password=${GESTOPAGO_TRUSTSTORE_PASSWORD:changeit}
spring.ssl.bundle.jks.gestopago.protocol=TLS
spring.ssl.bundle.jks.gestopago.options.enabled-protocols=TLSv1.3,TLSv1.2
# Imágenes públicas de Gesto Pago (logo del servicio y ayuda de la referencia) que se enlazan en el catálogo
gestopago.imagenes.base-url=${gestopago.base-url}/sistema/images/gestopago
# Nombre legible por tipoFront (Gesto Pago no lo envia); los no listados usan la categoria por defecto. Acentos con \uXXXX: Spring lee este archivo como ISO-8859-1
app.catalogo.categorias.1=Recargas y tarjetas de regalo
app.catalogo.categorias.2=Pago de servicios
app.catalogo.categorias.4=Pago con consulta de saldo
app.catalogo.categorias.40=Env\u00EDos de dinero
app.catalogo.categoria-por-defecto=Otros servicios
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO}
gestopago.auth.password=${GESTOPAGO_PASSWORD}
# Cada cuanto se REVISA el token guardado (no se solicita uno nuevo salvo que falte o haya vencido)
gestopago.auth.refresh-rate-ms=3600000
# El token de GestoPago dura 24 h: se reutiliza el guardado y se renueva poco antes de vencer (23 h 30 min).
# La documentacion de GestoPago pide tomar un solo token por dia
gestopago.auth.vigencia-minutos=1410
# Minimo entre dos solicitudes de token, aunque GestoPago rechace el actual
gestopago.auth.minutos-entre-solicitudes=10

# Productos
gestopago.productos.endpoint=/sistema/service/getProductList.do
gestopago.productos.connect-timeout=5000
gestopago.productos.read-timeout=10000

# Pago de servicios (sendTx)
gestopago.sendtx.endpoint=/sistema/service/sendTx.do
gestopago.sendtx.unidad=${GESTOPAGO_UNIDAD:}
gestopago.sendtx.zone=America/Mexico_City
# X-API-Key opcional (vacío = no se envía)
gestopago.api-key=${GESTOPAGO_API_KEY:}
# AES-256-CBC: SECRET_KEY (32 bytes) e IV (16 bytes), ambos en Base64. Sin valor por defecto: sin ellos no se envía nada
gestopago.crypto.secret-key=${GESTOPAGO_SECRET_KEY:}
gestopago.crypto.iv=${GESTOPAGO_IV:}
# GestoPago espera hasta 62 s (CODIGO 82): la lectura de sendTx debe superarlo
gestopago.sendtx.connect-timeout=5000
gestopago.sendtx.read-timeout=65000
# Códigos de sendTx que NO son un rechazo definitivo (p. ej. 82 = el proveedor dejó de esperar al operador):
# la operación queda INDETERMINADA y se concilia en lugar de reintegrar el saldo
# 06 tambien es indeterminado: se confirma despues con confirmTx (06 aplicada, 70 no aplicada)
gestopago.sendtx.codigos-indeterminados=82,06
# CODIGO de rechazo de sendTx -> motivo que ve el cliente (cualquier otro codigo -> RECHAZADO_PROVEEDOR)
# Errores propios de Gesto Pago (05 y 55 "Origen Valido"): el cliente ve que el error es del proveedor (ERROR_GESTOPAGO)
gestopago.sendtx.codigos-error-gestopago=05,55
# Vacio: el 05 que hemos recibido es "Origen Valido", no una referencia invalida
gestopago.sendtx.codigos-referencia-invalida=
gestopago.sendtx.codigos-sin-saldo-proveedor=02
# tipoFront que se pueden pagar: 1 recargas y tarjetas de regalo (precio fijo), 2 pago de servicios con referencia
pagos.tipos-front-pagables=1,2

# confirmTx: consulta el resultado real de un pago INDETERMINADO (lectura 15 s)
gestopago.confirmtx.endpoint=/sistema/service/confirmTx.do
gestopago.confirmtx.connect-timeout=5000
gestopago.confirmtx.read-timeout=15000
# Límites para productos de monto abierto (precio 0 en el catálogo); los de precio fijo exigen el precio exacto
gestopago.sendtx.monto-minimo=1.00
gestopago.sendtx.monto-maximo=10000.00

# Validación de referencia (verifyReference): consulta, no mueve dinero
gestopago.verifyref.endpoint=/sistema/service/verifyReference.do
gestopago.verifyref.connect-timeout=5000
gestopago.verifyref.read-timeout=15000
# tipoFront de los productos de PAGO con referencia (exigen comprobante de validaci\u00F3n)
pagos.referencia.tipos-front-pago=2
# tipoFront de los productos de CONSULTA de saldo (los \u00FAnicos para los que GestoPago documenta verifyReference)
gestopago.verifyref.tipos-front-consulta=4
# Candado en servidor: el pago por referencia exige el comprobante (idValidacion) emitido al validar
pagos.referencia.candado.habilitado=true
# Si la consulta en linea de GestoPago no responde (o contesta un codigo distinto de 01/02) se permite continuar
# solo con el formato: el usuario captura el importe y GestoPago valida la referencia al cobrar
pagos.referencia.permitir-sin-consulta=true
pagos.referencia.validacion-ttl-segundos=300

# Conciliación de pagos PENDIENTE/INDETERMINADA
gestopago.conciliacion.intervalo-ms=60000
gestopago.conciliacion.minutos-pendiente=5

# Swagger apagado por defecto (no expone el mapa del API en produccion). En local: SWAGGER_ENABLED=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Actuator: solo /actuator/health, sin índice de endpoints ni detalles de componentes.
# Redis es una caché opcional del catálogo: si no está disponible, la API sigue atendiendo (no debe marcarla DOWN)
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.health.redis.enabled=false

# Saldo con el que nace cada cuenta. El registro es publico: en produccion debe ser 0.00 (un saldo regalado es dinero
# gratis ilimitado). Solo un ambiente de pruebas lo sube, p. ej. APP_SALDO_INICIAL=1000.00
app.cuentas.saldo-inicial=${APP_SALDO_INICIAL:0.00}

# ---------- Protección del login ----------
# Intentos de POST /api/v1/auth/login por IP y por minuto (429 al excederlos). Holgado para usuarios detras de un mismo
# NAT: la fuerza bruta contra una cuenta la frena el bloqueo por usuario+IP (5 fallos) y por usuario (20 fallos)
app.auth.login.max-intentos-por-minuto=30
# Pagos y validaciones se cuentan por sesion (20 y 30 por minuto); ademas, tope por IP para todas las rutas sensibles
app.http.limite.ip-por-minuto=300
# Encabezado con la IP real del cliente. Vacio por defecto: se usa la IP de la conexion, que el cliente no puede falsificar.
# Solo detras de un proxy que SIEMPRE lo sobrescriba se configura; en Render: CLIENT_IP_HEADER=CF-Connecting-IP (Cloudflare)
app.http.client-ip-header=${CLIENT_IP_HEADER:}

# CORS: orígenes exactos de la SPA, separados por coma (nunca *). Por defecto, el servidor de desarrollo de Angular
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200,http://localhost:5000}


# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
# Timeout corto: si Redis no responde, se cae a PostgreSQL en 300 ms (antes 5 s por peticion)
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
spring.data.redis.password=${REDIS_PASSWORD:}

# Catalogo en memoria (GET /productos): se recarga cada 10 min o al sincronizar; si Redis falla se usa PostgreSQL 30 s
app.catalogo.cache-ttl-segundos=600
app.catalogo.redis-pausa-segundos=30

# Compresion gzip de respuestas JSON (el catalogo pesa ~580 KB sin comprimir)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

# Sincronización diaria de productos
gestopago.productos.sync-cron=0 0 6 * * *
#gestopago.productos.sync-cron=0 * * * * *
gestopago.productos.sync-zone=America/Mexico_City

# ---------- Logs sin datos personales ----------
# Spring registraba cada error de validacion con el valor rechazado (correo, telefono, CURP...). devtools lo activa en
# local; aqui se desactiva siempre. GlobalExceptionHandler ya responde y registra solo campo y regla
spring.mvc.log-resolved-exception=false
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Tope diario de recargas del panel de administrador (la recarga que lo rebase se rechaza con 422)
app.recargas.tope-diario-cuenta=${APP_RECARGAS_TOPE_CUENTA:100000.00}
app.recargas.tope-diario-ejecutivo=${APP_RECARGAS_TOPE_EJECUTIVO:200000.00}
