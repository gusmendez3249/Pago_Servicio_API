name: Web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build -- --base-href /Pago_Servicio_API/
      # Rutas del SPA: GitHub Pages sirve 404.html para cualquier ruta desconocida
      - run: cp dist/gesto-pago-web/browser/index.html dist/gesto-pago-web/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/gesto-pago-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
